<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games in My Pocket</title>
<style>
  :root { --bg:#FAFAF8; --fg:#1C1D21; --muted:#6B6F78; --line:#E4E5E8; --card:#FFFFFF; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141518; --fg:#EDEDEA; --muted:#A0A3AB; --line:#2B2D33; --card:#1C1E22; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    line-height:1.6; }
  main { max-width:640px; margin:0 auto; padding:72px 20px; }
  h1 { font-size:32px; margin:0 0 8px; letter-spacing:-0.5px; }
  p { color:var(--muted); margin:0 0 32px; }
  ul { list-style:none; padding:0; margin:0; border:1px solid var(--line); border-radius:16px; background:var(--card); }
  li + li { border-top:1px solid var(--line); }
  a { display:block; padding:16px 20px; color:var(--fg); text-decoration:none; }
  a:hover { background:rgba(127,127,127,0.06); }
  footer { margin-top:48px; font-size:14px; color:var(--muted); }
  footer a { display:inline; padding:0; color:inherit; text-decoration:underline; }
</style>
</head>
<body>
<main>
  <h1>Games in My Pocket</h1>
  <p>가볍게 한 판 즐기는 미니게임 모음<br>Classic mini games for a quick break</p>
  <ul>
    <li><a href="privacy/">개인정보 처리방침 · Privacy Policy →</a></li>
  </ul>
  <footer>문의 · Contact: <a href="mailto:gamesinmypocket.app@gmail.com">gamesinmypocket.app@gmail.com</a></footer>
</main>
</body>
</html>
